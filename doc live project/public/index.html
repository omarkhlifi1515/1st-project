<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">

    <title>doc live</title>
  </head>
  <body>
    
    <div class="editor-container">
    <!-- Toolbar -->
    <div class="toolbar">
        <button onclick="format('bold')" title="Bold"><b>B</b></button>
        <button onclick="format('italic')" title="Italic"><i>I</i></button>
        <button onclick="format('underline')" title="Underline"><u>U</u></button>
        <button onclick="format('strikeThrough')" title="Strikethrough"><s>S</s></button>
        <button onclick="format('justifyLeft')" title="Align Left">Left</button>
        <button onclick="format('justifyCenter')" title="Align Center">Center</button>
        <button onclick="format('insertOrderedList')" title="Numbered List">1.</button>
        <button onclick="format('insertUnorderedList')" title="Bullet List">•</button>
        
        <!-- Color Picker -->
        <input type="color" onchange="format('foreColor', this.value)" title="Text Color" style="border:none; height:30px; cursor:pointer;">
    </div>

    <!-- Editable Area -->
    <div id="doc-area" contenteditable="true"></div>
</div>

    <script src="scripts.js"></script>
  </body>
</html>
